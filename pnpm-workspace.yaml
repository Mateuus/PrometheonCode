# A extensão do VS Code continua fora do workspace: ela usa npm próprio e já
# está estável. Migrar `extension/` para cá é assunto de outra rodada.
packages:
  - 'apps/*'
  - 'packages/*'

# Scripts de build aprovados. O pnpm exige a lista explícita: sem ela, o pacote
# instala mas não compila o binário nativo, e a falha só aparece em runtime.
# `argon2` é o caso crítico — sem binário, nenhuma senha é conferida.
allowBuilds:
  argon2: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  '@swc/core': true

minimumReleaseAgeExclude:
  - bullmq@5.81.3

# Um script de build fora da lista vira aviso, não erro de install.
strictDepBuilds: false

# Sem isto, todo `pnpm exec`/`pnpm run` revalida as dependências e falha antes
# mesmo de executar o comando pedido.
verifyDepsBeforeRun: false
