# Prometheon Hub — produção.
#
# O reverse proxy é o aaPanel, que roda no host. Por isso não há nginx aqui, e
# por isso a API e o web publicam em `127.0.0.1`: o nginx alcança pelo loopback,
# e ninguém mais na rede alcança.
#
# Publicar em `0.0.0.0` seria mais do que "porta aberta na LAN". A API roda com
# `trustProxy: true` — ela precisa disso para ler o IP real que o nginx repassa
# em `X-Forwarded-For`, senão o rate limit por IP trataria todo mundo como um
# endereço só. O efeito colateral é que ela **confia** nesse cabeçalho: quem
# alcançar a porta diretamente forja o IP que quiser e contorna todos os tetos
# de tentativa. O `127.0.0.1` é o que fecha isso.
#
# MySQL e Redis não publicam porta nenhuma: falam só pela rede interna.

name: prometheon-hub

services:
  # -------------------------------------------------------------------------
  # Dados
  # -------------------------------------------------------------------------

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      # O schema foi criado com esta collation; deixar o servidor divergir faria
      # comparações de texto se comportarem diferente entre tabelas.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # O Hub grava instantes com milissegundos e sempre em UTC.
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME:?defina DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER:?defina DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # `mysqladmin ping` responde antes de o banco aceitar conexão de verdade
      # na primeira subida; o `--silent` com credencial confere o caminho todo.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Senha obrigatória mesmo em rede interna: Redis sem autenticação aceita
    # comandos que gravam arquivo no disco do container, e é o alvo favorito de
    # quem já conseguiu executar qualquer coisa dentro da rede.
    command: ['redis-server', '--requirepass', '${VALKEY_PASSWORD:?defina VALKEY_PASSWORD}', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${VALKEY_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [internal]

  # -------------------------------------------------------------------------
  # Migrations
  # -------------------------------------------------------------------------

  # Roda uma vez e sai. A API só sobe depois que este serviço terminar com
  # sucesso — subir a API antes das migrations deixaria o Hub respondendo 500
  # em tudo enquanto alguém tenta entender o que houve.
  migrate:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    image: prometheon-hub:latest
    restart: 'no'
    command: ['node', 'packages/database/dist/migrate.js']
    env_file: [.env]
    environment:
      DATABASE_HOST: mysql
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@redis:6379
    depends_on:
      mysql:
        condition: service_healthy
    networks: [internal]

  # -------------------------------------------------------------------------
  # Aplicação
  # -------------------------------------------------------------------------

  api:
    image: prometheon-hub:latest
    restart: unless-stopped
    command: ['node', 'apps/hub-api/dist/server.js']
    env_file: [.env]
    environment:
      DATABASE_HOST: mysql
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@redis:6379
      SMTP_HOST: mailserver
      SMTP_PORT: '587'
    ports:
      # Só loopback. Ver o comentário no topo do arquivo.
      - '127.0.0.1:${HUB_API_PORT:-3551}:3551'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3551/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [internal]

  worker:
    image: prometheon-hub:latest
    restart: unless-stopped
    command: ['node', 'apps/hub-worker/dist/server.js']
    env_file: [.env]
    environment:
      DATABASE_HOST: mysql
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@redis:6379
      SMTP_HOST: mailserver
      SMTP_PORT: '587'
    # Sem `ports`: a porta de health do worker (3552) é alcançada de dentro da
    # rede, ou por `docker compose exec`. Ela não tem por que sair daqui.
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]

  web:
    image: prometheon-hub:latest
    restart: unless-stopped
    # Chama o binário do Next diretamente, e não via `pnpm exec`: o corepack
    # tentaria baixar o pnpm na primeira execução, e o container falharia ao
    # subir numa máquina sem saída para o registry — ou ficaria esperando por ela.
    #
    # `--hostname 0.0.0.0` é dentro do container; quem restringe ao loopback do
    # host é o mapeamento de porta abaixo.
    # `working_dir` no app: o `next start` procura o `.next` no diretório atual.
    working_dir: /app/apps/hub-web
    command:
      - node
      - /app/apps/hub-web/node_modules/next/dist/bin/next
      - start
      - --port
      - '3550'
      - --hostname
      - 0.0.0.0
    env_file: [.env]
    ports:
      - '127.0.0.1:${HUB_WEB_PORT:-3550}:3550'
    depends_on:
      api:
        condition: service_started
    networks: [internal]

  # -------------------------------------------------------------------------
  # SMTP
  # -------------------------------------------------------------------------

  mailserver:
    image: mailserver/docker-mailserver:latest
    hostname: ${MAIL_HOSTNAME:-smtp.prometheoncode.xyz}
    restart: unless-stopped
    env_file: [../mail/mailserver.env]
    ports:
      # 25 — recebimento entre servidores. É por onde chega tanto a mensagem que
      # alguém manda para `mateus@`, quanto a devolução de um envio recusado.
      - '25:25'
      # 587 — envio autenticado a partir de um cliente de e-mail. Precisa ser
      # pública: é a porta que o Thunderbird e o celular usam para mandar. A API
      # não passa por aqui, fala pela rede interna.
      - '587:587'
      # 993 — leitura da caixa (IMAP sobre TLS). Sem ela, a mensagem chega e
      # fica gravada dentro do container, sem forma de abrir.
      - '993:993'
    volumes:
      - mail-data:/var/mail
      - mail-state:/var/mail-state
      - mail-logs:/var/log/mail
      - ../mail/config/:/tmp/docker-mailserver/
      # Reaproveita o certificado que o aaPanel já emitiu e renova para o
      # subdomínio — um segundo Let's Encrypt para o mesmo host disputaria a
      # validação com o primeiro.
      - /www/server/panel/vhost/cert/${MAIL_HOSTNAME:-smtp.prometheoncode.xyz}/:/etc/letsencrypt/live/${MAIL_HOSTNAME:-smtp.prometheoncode.xyz}/:ro
    cap_add:
      - NET_ADMIN
    networks: [internal]

volumes:
  mysql-data:
  redis-data:
  mail-data:
  mail-state:
  mail-logs:

networks:
  internal:
    driver: bridge
