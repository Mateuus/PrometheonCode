# Serviços de apoio do desenvolvimento local.
#
# MySQL e Redis não estão aqui de propósito: eles já rodam em 192.168.5.210 e
# são configurados pelo .env. Este arquivo sobe só o que falta na máquina.
services:
  # Servidor SMTP de desenvolvimento. Recebe tudo e não entrega nada para fora,
  # então nenhum e-mail de teste chega a um endereço real.
  maildev:
    image: maildev/maildev:2.1.0
    container_name: prometheon-maildev
    restart: unless-stopped
    environment:
      MAILDEV_INCOMING_USER: ''
      MAILDEV_INCOMING_PASS: ''
    ports:
      - '1025:1025' # SMTP
      - '1080:1080' # interface web
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:1080/healthz']
      interval: 10s
      timeout: 3s
      retries: 5

  # Transcrição de voz — o ditado do chat.
  #
  # Fica atrás de um profile porque a imagem tem vários gigabytes e carrega um
  # modelo de fala na memória: quem não está mexendo no microfone não deveria
  # pagar isso em toda subida. Para ligar:
  #
  #     docker compose -f docker-compose.dev.yml --profile voice up -d
  #
  # E no `.env` da raiz:
  #
  #     TRANSCRIPTION_ENABLED=true
  #     TRANSCRIPTION_URL=http://127.0.0.1:8000
  #
  # Em desenvolvimento o modelo `small` responde bem mais rápido em CPU que o
  # `large-v3-turbo` e erra pouco o suficiente para revisar a interface. Trocar
  # para o modelo grande é mudar as duas variáveis abaixo.
  applio:
    image: mateuus27/applio-api:latest
    container_name: prometheon-applio
    restart: unless-stopped
    profiles: [voice]
    environment:
      PYTHONUNBUFFERED: '1'
      DOCKER_CONTAINER: '1'
      STREAMING_ENABLED: 'true'
      STREAMING_MODEL_SIZE: small
      STREAMING_DEVICE: cpu
      STREAMING_PRELOAD: 'true'
      # O `/transcribe` em lote usa outro motor e outros pesos. Sem o ditado
      # precisar dele, pré-carregá-lo seriam alguns gigabytes de RAM parados.
      WHISPER_PRELOAD: 'false'
      # Diarização é para separar quem fala o quê numa gravação com várias
      # pessoas. O ditado tem uma pessoa só, ao vivo.
      PYANNOTE_PRELOAD: 'false'
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      # Carregar os pesos leva bem mais que a subida de um serviço comum, e um
      # start_period curto marcaria o contêiner como doente durante o normal.
      start_period: 120s
