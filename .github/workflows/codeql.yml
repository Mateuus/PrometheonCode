name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Toda segunda-feira às 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: ${{ matrix.language }}
          # security-extended cobre mais padrões de injeção e de fluxo de dados.
          queries: security-extended
          # O bundle é gerado pelo passo de compilação logo abaixo. Analisá-lo
          # repete cada achado do fonte num arquivo que ninguém revisa nem
          # versiona.
          config: |
            paths-ignore:
              - extension/dist
              - extension/out

      - name: Instalar dependências
        run: npm run ci:install

      - name: Compilar extensão
        run: npm run compile

      - name: Analisar
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: /language:${{ matrix.language }}
